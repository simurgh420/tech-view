name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    env:
      # یک URL مشخص و مشترک برای همه مراحل
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      CI: true

    strategy:
      matrix:
        node-version: [18, 20]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Postgres service is healthy
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test -d testdb; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Postgres failed to become ready"
          exit 1

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma schema (db push)
        run: npx prisma db push --accept-data-loss

      - name: Seed database (optional)
        # اگر اسکریپت seed داری در package.json مثل: "prisma:seed": "node prisma/seed.ts"
        # به صورت اختیاری اجرا می‌شود
        run: npm run prisma:seed --if-present

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage
          if-no-files-found: ignore

  build:
    name: Build check (Next.js 16 + React 19)
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        node-version: [20] # بیلد را روی نسخه stable انجام بده

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build app
        env:
          # اگر Next.js به env نیاز دارد، متغیرهای لازم را اینجا ست کن یا با secrets بیاور
          # مثال: NEXT_PUBLIC_SITE_URL: https://example.com
          # برای بیلد معمولاً دیتابیس نیاز نیست، مگر کدی در زمان بیلد به DB وصل شود
          CI: true
        run: npm run build
